# =====================================================================
# 아이디어 심사 루브릭 — 다관점·정량 평가
# 모든 차원은 "높을수록 좋음" (리스크 차원도 '통제될수록 고점'으로 정규화)
# 점수 척도 0~10. 가중합 → 0~100.
# =====================================================================

scale:
  min: 0
  max: 10
  # 점수 인플레 방지용 캘리브레이션 앵커 (프롬프트에 주입)
  anchors:
    "0-2": "치명적 결함 / 공란 / 무의미. 근거 전무."
    "3-4": "약함. 큰 우려, 근거 부족, 평범 이하."
    "5-6": "보통. 가능하나 미검증·평범. 차별점 약함."
    "7-8": "강함. 명확한 근거와 차별성. 추진 가치 있음."
    "9-10": "탁월. 압도적 근거. 즉시 추진 가치. 드물게 부여."

# ---------------------------------------------------------------------
# 평가 차원 (가중치 합 = 1.0)
# ---------------------------------------------------------------------
dimensions:
  - key: problem
    name: "문제 정의·심각도"
    weight: 0.16
    question: "해결하려는 문제가 실재하고 충분히 고통스러운가? 구체적이고 검증 가능한가? '있으면 좋은 것'이 아니라 '반드시 필요한 것'인가?"
  - key: target
    name: "타겟 명확성·도달성"
    weight: 0.10
    question: "타겟 유저가 좁고 명확하게 정의됐는가? 초기 거점 세그먼트에 도달·획득이 현실적인가?"
  - key: market
    name: "시장성·수요"
    weight: 0.15
    question: "충분한 시장 규모와 실수요(검색량/대안 지출/대기수요)가 있는가? 타이밍은 왜 지금인가?"
  - key: differentiation
    name: "차별성·해자"
    weight: 0.15
    question: "기존 대안/경쟁 대비 10x 차별점이 있는가? 모방 방어가 가능한 해자(데이터/네트워크/전환비용)가 있는가?"
  - key: feasibility
    name: "실현 가능성"
    weight: 0.14
    question: "현실적 기술/자원/기간으로 6~12주 MVP가 가능한가? 핵심 기술·데이터 의존성이 확보 가능한가?"
  - key: business
    name: "사업성·수익모델"
    weight: 0.10
    question: "가치 포착(수익화) 경로가 그럴듯한가? 단위경제(CAC/LTV)와 지불 주체가 분명한가?"
  - key: impact
    name: "기대효과·임팩트"
    weight: 0.10
    question: "성공 시 만들어내는 가치/임팩트의 크기와 측정가능성. 회사 전략 적합성."
  - key: risk_control
    name: "리스크 통제(정규화)"
    weight: 0.10
    question: "치명적 리스크(법/규제, 외부 의존, 채택 장벽, 윤리)가 식별·통제 가능한가? 통제될수록 고점, 통제 불가 치명 리스크면 저점."

# ---------------------------------------------------------------------
# 평가 패널 — 각 페르소나가 모든 차원을 독립 채점 후 가중 집계
# ---------------------------------------------------------------------
panel:
  - key: vc
    name: "VC 투자자"
    lens: "수익률·확장성·해자·회수가능성에 집착. 냉정하게 기각 사유부터 찾는다. 'so what'과 'why now'를 끝까지 묻는다."
  - key: user
    name: "타겟 유저"
    lens: "내가 실제로 쓰고 돈을 낼 것인가? 지금 쓰는 대안 대비 충분히(10x) 좋은가? 전환 귀찮음을 이길 만큼인가?"
  - key: tech_lead
    name: "기술 리드"
    lens: "구현 복잡도·데이터/모델 의존성·운영비용·보안/확장 난도. MVP 범위로 쪼갤 수 있는가?"
  - key: red_team
    name: "비판가(레드팀)"
    lens: "이 아이디어가 '실패하는 이유'를 적극적으로 찾는다. 숨은 가정·치명 결함·시장 착각을 폭로. 점수 인플레를 억제하는 역할."
  - key: pm
    name: "PM/디자이너"
    lens: "온보딩/UX, 채택 장벽, GTM, 리텐션. 사용자가 첫 가치(aha)에 빠르게 도달하고 계속 쓰게 만들 수 있는가?"

# 집계 시 각 페르소나 점수의 가중치 (합 = 1.0)
panel_weights:
  vc: 0.25
  user: 0.25
  tech_lead: 0.20
  red_team: 0.15
  pm: 0.15

# ---------------------------------------------------------------------
# 최종 점수(0~100) → 판정 밴드 (위에서부터 첫 충족 밴드 적용)
# ---------------------------------------------------------------------
verdict_bands:
  - min: 80
    label: "STRONG PASS — 본선 강력 추천"
  - min: 66
    label: "PASS — 본선 진출"
  - min: 50
    label: "REVISE — 보완 후 재검토"
  - min: 0
    label: "REJECT — 탈락"

# 시장반응 시뮬레이션 점수를 최종 점수에 반영하는 비율
# final = market_blend * 시장반응(0~100) + (1-market_blend) * 패널가중합(0~100)
market_blend: 0.20
