# =====================================================================
# 시장반응 시뮬레이션 설정 (MiroFish 식 합성 페르소나 — 자체 경량 구현)
# 타겟 유저 설명으로부터 합성 소비자 페르소나를 생성하고 각자의 반응을 시뮬레이션.
# =====================================================================

simulation:
  num_personas: 10        # 아이디어당 생성할 합성 타겟 페르소나 수
  temperature: 0.85       # 반응 다양성 확보
  reaction_scale: 10      # excitement 척도

# 페르소나는 아이디어의 '타겟 유저' 필드에서 동적 생성됨.
# 아래 축으로 다양성·현실성을 강제 (한쪽으로 쏠린 낙관 방지).
diversity_axes:
  - "연령/세대 (Gen Z ~ 시니어)"
  - "기술 친숙도 (얼리어답터 ~ 라가드)"
  - "가격 민감도 (고민감 ~ 저민감)"
  - "현재 사용 중인 대안/경쟁 서비스 (반드시 1개 명시)"
  - "사용 맥락·빈도 (헤비 ~ 라이트, 비사용 후보 포함)"
  - "성향 (열성 지지 ~ 냉소적 회의)"

# 각 페르소나가 산출할 반응 필드
reaction_fields:
  - adopt_probability    # 0.0~1.0  무료라면 시도해볼 확률
  - pay_probability      # 0.0~1.0  유료 전환 확률
  - willingness_to_pay   # 정수 KRW/월 (지불의향 0 가능)
  - excitement           # 0~10
  - top_objection        # 가장 큰 거부/이탈 이유 (구체적으로)
  - switching_barrier    # low | med | high  (기존 대안→신규 전환 장벽)

# 집계 → 시장반응 점수(0~100) 산식 가중치
demand_score_weights:
  adopt_rate: 0.35       # 평균 adopt_probability
  pay_rate: 0.35         # 평균 pay_probability
  excitement: 0.30       # 평균 excitement/10
# 주: 회의적 페르소나 비중이 자동 반영되어 낙관 편향을 상쇄.
